<svg width="229" height="68" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TasteCraft – Modern Recipe Blog">
  <rect width="100%" height="100%" fill="#ffffff"/> <!-- Explicitly set to white -->
  <text x="50%" y="60" font-family="Georgia, serif" font-size="48" fill="url(#goldGradient)" text-anchor="middle" font-weight="bold">TASTECRAFT</text>
  <text x="50%" y="100" font-family="Segoe UI, sans-serif" font-size="18" fill="#333333" text-anchor="middle" letter-spacing="2">MODERN RECIPE BLOG</text>
  <g transform="translate(230, 20) scale(0.6)">
    <!-- Chef Hat -->
    <path d="M50 10c0-5-5-10-10-10s-10 5-10 10c-5-5-10-5-15 0-5-5-10-5-15 0 0 5 0 10 5 15h40c5-5 5-10 5-15z" fill="#1a1a1a" stroke="url(#goldGradient)" stroke-width="2"/>
  </g>
  <g transform="translate(120, 20) scale(0.6)">
    <!-- Knife -->
    <rect x="0" y="0" width="6" height="35" fill="url(#goldGradient)"/>
  </g>
  <g transform="translate(340, 20) scale(0.6)">
    <!-- Fork -->
    <rect x="0" y="0" width="4" height="10" fill="url(#goldGradient)"/>
    <rect x="0" y="12" width="4" height="22" fill="url(#goldGradient)"/>
  </g>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5a253;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>